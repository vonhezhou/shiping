publish_to: 'none'
version: 0.10.0+10

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  logging: ^1.3.0
  logging_appenders: ^1.4.0+1
  path: ^1.9.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: 26.3.4

flutter:
  uses-material-design: true
