name: Checks

on:
  push:
    branches:
      - '**'
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter --no-version-check pub get --enforce-lockfile
      - name: Check localizations
        run: python3 tool/check_localizations.py
      - name: Check generated protocol
        run: python3 tool/check_protocol.py
      - name: Analyze
        run: flutter --no-version-check analyze --no-pub
      - name: Unit and UI tests
        run: flutter --no-version-check test --no-pub --reporter expanded
      - name: Native PNG export
        run: python3 tool/test_annotation_export.py

  macos-release:
    name: macOS Release (ad hoc, not notarized)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Validate version tag
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          source = pathlib.Path('pubspec.yaml').read_text()
          version = re.search(r'^version:\s*(\S+)', source, re.MULTILINE).group(1)
          expected = 'v' + version.split('+', 1)[0]
          if os.environ['GITHUB_REF_NAME'] != expected:
              raise SystemExit(f'Version tag must match pubspec.yaml: {expected}')
          PY
      - name: Install dependencies
        run: flutter --no-version-check pub get --enforce-lockfile
      - name: Build macOS Release with ad hoc signing
        run: |
          cat > "$RUNNER_TEMP/release-adhoc.xcconfig" <<'CONFIG'
          CODE_SIGN_IDENTITY = -
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM =
          PROVISIONING_PROFILE_SPECIFIER =
          CONFIG
          XCODE_XCCONFIG_FILE="$RUNNER_TEMP/release-adhoc.xcconfig" \
            flutter --no-version-check build macos --release --no-pub
      - name: Verify signing and create DMG
        run: |
          app="build/macos/Build/Products/Release/拾屏.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=4 "$app" 2> "$RUNNER_TEMP/signature.txt"
          cat "$RUNNER_TEMP/signature.txt"
          grep -Fx 'Signature=adhoc' "$RUNNER_TEMP/signature.txt"

          package="shiping-${GITHUB_REF_NAME}-macos-adhoc"
          staging=$(mktemp -d "$RUNNER_TEMP/shiping-dmg.XXXXXX")
          trap 'rm -rf "$staging"' EXIT
          mkdir -p dist
          ditto "$app" "$staging/拾屏.app"
          ln -s /Applications "$staging/应用程序"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          architectures=$(lipo -archs "$app/Contents/MacOS/$executable")
          cat > "$staging/BUILD-INFO.txt" <<INFO
          拾屏 macOS Release — ad hoc 签名构建
          Tag: $GITHUB_REF_NAME
          Commit: $GITHUB_SHA
          Architectures: $architectures
          Minimum macOS: 14.0

          此构建仅使用 ad hoc 签名，没有 Developer ID 签名，未公证，未 stapling。
          macOS Gatekeeper 可能阻止打开；此产物用于测试，不是已公证发行版。
          安装：打开 DMG，将「拾屏.app」拖到旁边的「应用程序」快捷方式，再推出磁盘镜像。
          从「应用程序」启动拾屏后，从菜单栏进入设置。
          截图、取色、测量与录屏需在系统设置中为实际运行的应用授权屏幕录制。
          CI 检查不包含需要已授权、解锁桌面的真实 macOS 集成测试及人工验收。
          Developer ID 签名、公证和 stapling 将在后续配置。
          INFO
          hdiutil create -volname "拾屏 ${GITHUB_REF_NAME}" -srcfolder "$staging" \
            -ov -format UDZO -fs HFS+ "dist/$package.dmg"
          python3 tool/test_macos_dmg.py "dist/$package.dmg"
          (cd dist && shasum -a 256 "$package.dmg" > "$package.dmg.sha256")
          {
            echo '## macOS Release — ad hoc 签名，未公证'
            echo
            cat "$staging/BUILD-INFO.txt"
            echo
            echo "安装包将单独发布到 https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
            echo "下方 Artifacts 保留 ${package} 作为 CI 备份，下载时 GitHub 会将其包装为 ZIP。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "PACKAGE_NAME=$package" >> "$GITHUB_ENV"
      - name: Upload macOS Release (ad hoc, not notarized)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
          compression-level: 0

  publish-release:
    name: Publish DMG and checksum to GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: macos-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shiping-${{ github.ref_name }}-macos-adhoc
          path: dist
      - name: Publish separate installer downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_NAME: shiping-${{ github.ref_name }}-macos-adhoc
        run: |
          (cd dist && shasum -a 256 -c "$PACKAGE_NAME.dmg.sha256")
          cat > "$RUNNER_TEMP/release-notes.md" <<NOTES
          ## macOS 安装包

          **[下载拾屏安装包（DMG）](https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}/${PACKAGE_NAME}.dmg)** · [下载 SHA-256 校验文件](https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}/${PACKAGE_NAME}.dmg.sha256)

          需要 macOS 14 或更新版本。打开 DMG，将「拾屏.app」拖到「应用程序」快捷方式，复制完成后推出镜像，再从「应用程序」启动。

          **当前应用使用 ad hoc 签名，没有 Developer ID 签名，未公证、未 stapling，仅供测试。macOS Gatekeeper 可能阻止打开。**

          Assets 中的 **.dmg** 是安装包，**.dmg.sha256** 用于校验；GitHub 自动提供的 **Source code (zip)** 和 **Source code (tar.gz)** 是源代码，不包含可直接安装的应用。

          下载两个文件后，可在所在目录执行：

              shasum -a 256 -c ${PACKAGE_NAME}.dmg.sha256

          构建已通过 CI 检查及 DMG 挂载、安装快捷方式和复制后签名验证；不代表完整真实桌面功能回归或人工验收通过。
          NOTES
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "dist/$PACKAGE_NAME.dmg#拾屏 macOS 安装包（DMG，ad hoc）" \
              "dist/$PACKAGE_NAME.dmg.sha256#SHA-256 校验文件" --clobber
          else
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "拾屏 ${RELEASE_TAG}（macOS · ad hoc）" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              "dist/$PACKAGE_NAME.dmg#拾屏 macOS 安装包（DMG，ad hoc）" \
              "dist/$PACKAGE_NAME.dmg.sha256#SHA-256 校验文件"
          fi
          echo "安装包下载：https://github.com/${GH_REPO}/releases/tag/${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
